# Tests, build y E2E en cada push y pull request. El deploy sigue siendo manual.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium: los tests del motor (Vitest browser mode) y los E2E corren ahí.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run e2e
